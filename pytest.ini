[pytest]
testpaths = tests
addopts = -ra
# AItan is a PyQt6 app. The venv also has PySide6 (for the bundled
# AItsugi); without this, pytest-qt auto-picks PySide6 and its QWidget
# isinstance checks reject the PyQt6 widgets the tests create.
qt_api = pyqt6
filterwarnings =
    ignore::DeprecationWarning
